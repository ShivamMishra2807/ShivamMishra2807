<svg fill="none" viewBox="0 0 850 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      .pulsing-cyan {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .pulsing-violet {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="70" fill="#0284c7" opacity="0.45" filter="url(#glowCyan)" class="pulsing-cyan"/>
  <circle cx="740" cy="180" r="90" fill="#7c3aed" opacity="0.45" filter="url(#glowViolet)" class="pulsing-violet"/>

  <!-- Decorative Outer Border -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal Window Controls Bar -->
  <rect x="2" y="2" width="846" height="34" rx="16" fill="#0f172a" fill-opacity="0.8"/>
  <rect x="2" y="24" width="846" height="12" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="2" y1="36" x2="848" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5" fill="#10b981"/>

  <!-- Terminal Title -->
  <text x="425" y="22" fill="#64748b" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="500">shivam@developer-workstation: ~/portfolio</text>

  <!-- Top Status Pill -->
  <g transform="translate(42, 60)">
    <rect width="210" height="24" rx="12" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8"/>
    <text x="24" y="16" fill="#38bdf8" class="tag-text">VIT MUMBAI • IT UNDERGRAD</text>
  </g>

  <!-- Main Headline -->
  <text x="42" y="122" fill="url(#titleGrad)" class="title">Shivam Mishra</text>

  <!-- Subtitle / Positioning statement -->
  <text x="42" y="152" fill="url(#subGrad)" class="subtitle">Full-Stack Engineer &amp; AI Systems Developer • Building Impactful, Production-Grade Platforms</text>

  <!-- Focus Tags / Tech Chips -->
  <g transform="translate(42, 178)">
    <!-- Chip 1: React & Django -->
    <g transform="translate(0, 0)">
      <rect width="116" height="26" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
      <text x="24" y="17" fill="#e2e8f0" class="badge-text">React &amp; Django</text>
    </g>

    <!-- Chip 2: Agentic AI -->
    <g transform="translate(126, 0)">
      <rect width="128" height="26" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#a855f7"/>
      <text x="24" y="17" fill="#e2e8f0" class="badge-text">LangGraph &amp; AI</text>
    </g>

    <!-- Chip 3: GIS LandStack -->
    <g transform="translate(264, 0)">
      <rect width="138" height="26" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="24" y="17" fill="#e2e8f0" class="badge-text">GIS &amp; PostgreSQL</text>
    </g>

    <!-- Chip 4: Java & DSA -->
    <g transform="translate(412, 0)">
      <rect width="102" height="26" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#f59e0b"/>
      <text x="24" y="17" fill="#e2e8f0" class="badge-text">Java &amp; DSA</text>
    </g>
  </g>

  <!-- Right Side Accent Code Box -->
  <g transform="translate(620, 58)">
    <rect width="190" height="146" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
    <text x="14" y="24" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">// developer.json</text>
    <text x="14" y="44" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="11">const <tspan fill="#38bdf8">shivam</tspan> = {</text>
    <text x="26" y="64" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">role: <tspan fill="#a855f7">"SWE"</tspan>,</text>
    <text x="26" y="84" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">focus: <tspan fill="#a855f7">"Full-Stack"</tspan>,</text>
    <text x="26" y="104" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">status: <tspan fill="#34d399">"Building"</tspan>,</text>
    <text x="26" y="124" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="11">dsa: <tspan fill="#f59e0b">"Active"</tspan></text>
    <text x="14" y="140" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="11">};</text>
  </g>
</svg>
